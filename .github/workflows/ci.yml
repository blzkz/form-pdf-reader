# Build and test on every push to master and on pull requests.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # Old glibc (2.35) so the binary also runs on Ubuntu 22.04 and Debian 12.
    # Canonical image on ECR Public: Docker Hub rate-limits anonymous pulls.
    container: public.ecr.aws/ubuntu/ubuntu:22.04
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config fontconfig fonts-liberation
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: PDFium
        run: scripts/descargar-pdfium.sh
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
