# Windows 10/11 (x64): builds, tests and packages the desktop app.
#
# Produces, in the "windows" artifact:
#   form-pdf-reader-<version>-windows-x64-portable.zip  (unzip and run)
#   form-pdf-reader-<version>-windows-x64-setup.exe     (Inno Setup installer)
# The Release workflow calls this one and attaches both to the release.
name: Windows

# From the Release workflow, or by hand (Actions > Windows > Run workflow) to
# try the installer before a release.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup update stable --no-self-update && rustup default stable
      # Dependencies and target/ from the last build (a new version changes
      # Cargo.lock, so an exact key would never hit).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - name: PDFium
        run: PDFIUM_PLATFORM=win-x64 scripts/descargar-pdfium.sh
      - name: Build
        run: cargo build --release --locked
      # Tests only when run by hand: releases are tested before tagging.
      - name: Test
        if: github.event_name == 'workflow_dispatch'
        run: |
          export PATH="$PWD/vendor/pdfium/bin:$PATH"
          cargo test --release --locked
      - name: Third-party notices
        run: python scripts/third_party_notices.py --package form-pdf-reader --target x86_64-pc-windows-msvc --pdfium vendor/pdfium --out target/THIRD-PARTY-NOTICES.txt
      - name: Portable zip
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/windows
          cp target/release/form-pdf-reader.exe vendor/pdfium/bin/pdfium.dll dist/windows/
          cp LICENSE dist/windows/LICENSE.txt
          cp target/THIRD-PARTY-NOTICES.txt dist/windows/
          (cd dist/windows && 7z a -tzip "../form-pdf-reader-$VERSION-windows-x64-portable.zip" ./*)
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSrcDir=$PWD\dist\windows" packaging\windows\form-pdf-reader.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
