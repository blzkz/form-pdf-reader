# Push a tag like v0.3.1 to build the packages and publish a GitHub release:
#
#   git tag v0.3.1 && git push origin v0.3.1
#
# Produces: .deb (Debian/Ubuntu), .rpm (Fedora), .pkg.tar.zst (Arch/CachyOS),
# a self-contained .tar.gz, and for Windows a portable .zip and an installer
# (workflow windows.yml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Old glibc (2.35): one binary for Ubuntu 22.04+, Debian 12+, Fedora, Arch.
    # The Ubuntu 22.04 runner itself, not a container: pulling the image
    # (Docker Hub, ECR Public) fails often with "toomanyrequests".
    runs-on: ubuntu-22.04
    env:
      # Without the runner's PDFium folder in the binary's RPATH.
      FORM_PDF_READER_PACKAGE: "1"
    steps:
      - name: System packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config fontconfig fonts-liberation python3
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: PDFium
        run: scripts/descargar-pdfium.sh
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      # Licences of the Rust crates and PDFium shipped in the packages.
      - name: Third-party notices
        run: python3 scripts/third_party_notices.py --package form-pdf-reader --target x86_64-unknown-linux-gnu --pdfium vendor/pdfium --out target/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: binary
          path: |
            target/release/form-pdf-reader
            target/THIRD-PARTY-NOTICES.txt

  windows:
    uses: ./.github/workflows/windows.yml

  package:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binary
          path: target
      - name: PDFium
        run: |
          chmod +x target/release/form-pdf-reader
          scripts/descargar-pdfium.sh
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Packages
        env:
          MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>"
          HOMEPAGE: "${{ github.server_url }}/${{ github.repository }}"
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          export VERSION
          mkdir -p dist
          for p in deb rpm archlinux; do
            "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p "$p" -t dist/
          done
          SKIP_BUILD=1 scripts/empaquetar.sh
          rm -rf dist/*-x86_64/
          ls -l dist
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
