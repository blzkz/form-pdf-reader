# Push a tag like v0.2.0 to build the packages and publish a GitHub release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Produces: .deb (Debian/Ubuntu), .rpm (Fedora), .pkg.tar.zst (Arch/CachyOS)
# and a self-contained .tar.gz.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Old glibc (2.35): one binary for Ubuntu 22.04+, Debian 12+, Fedora, Arch.
    container: ubuntu:22.04
    steps:
      - name: System packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config fontconfig fonts-liberation
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: PDFium
        run: scripts/descargar-pdfium.sh
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: binary
          path: target/release/form-pdf-reader

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary
          path: target/release
      - name: PDFium
        run: |
          chmod +x target/release/form-pdf-reader
          scripts/descargar-pdfium.sh
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Packages
        env:
          MAINTAINER: "${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>"
          HOMEPAGE: "${{ github.server_url }}/${{ github.repository }}"
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          export VERSION
          mkdir -p dist
          for p in deb rpm archlinux; do
            "$(go env GOPATH)/bin/nfpm" package -f packaging/nfpm.yaml -p "$p" -t dist/
          done
          SKIP_BUILD=1 scripts/empaquetar.sh
          rm -rf dist/*-x86_64/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
