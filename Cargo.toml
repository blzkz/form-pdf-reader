[workspace]
members = ["crates/core", "crates/desktop", "crates/ffi"]
# `cargo build` en la raíz compila la app de escritorio; el puente de Android
# (crates/ffi) se compila aparte con -p form-pdf-reader-ffi.
default-members = ["crates/core", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/blzkz/form-pdf-reader"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
png = "0.18"
lopdf = { version = "0.45", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
