[package]
name = "form-pdf-reader"
description = "Lightweight PDF reader that fills in and saves dynamic XFA forms without Adobe Reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "form-pdf-reader"
path = "src/main.rs"

[dependencies]
form-pdf-reader-core = { path = "../core" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
png.workspace = true
rfd = "0.17"
# Iconos de la interfaz (Phosphor, MIT).
egui-phosphor = "0.14"
# Dibujo por CPU cuando no hay tarjeta gráfica (soft.rs).
bytemuck = "1"
egui-winit = { version = "0.36", default-features = false, features = ["accesskit", "clipboard", "links"] }
egui_software_backend = { path = "../egui_software_backend", features = ["rayon"] }
softbuffer = "0.4"
sha2 = "0.10"
serde_json = "1"

# Linux: OpenGL (glow). Windows: wgpu (Direct3D 12); sin tarjeta gráfica,
# dibujo por CPU (soft.rs).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# Certificados en tarjetas y en las bases de los navegadores (PKCS#11).
cryptoki-sys = "0.5"
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
pollster = "0.4"
raw-window-handle = "0.6"

# Icono y datos de versión del .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Solo para pruebas: EFRAME_SCREENSHOT_TO=/ruta.png guarda una captura y sale.
screenshot = ["eframe/__screenshot"]
