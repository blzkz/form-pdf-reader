[package]
name = "form-pdf-reader"
description = "PDF reader that fills in and saves dynamic XFA forms without Adobe Reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "form-pdf-reader"
path = "src/main.rs"

[dependencies]
form-pdf-reader-core = { path = "../core" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
png.workspace = true
rfd = "0.17"

# Linux: OpenGL (glow). Windows: wgpu (Direct3D 12, con el adaptador por
# software de Windows si no hay tarjeta gráfica, como en máquinas virtuales).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }

# Icono y datos de versión del .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Solo para pruebas: EFRAME_SCREENSHOT_TO=/ruta.png guarda una captura y sale.
screenshot = ["eframe/__screenshot"]
