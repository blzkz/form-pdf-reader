[package]
name = "form-pdf-reader"
description = "PDF reader that fills in and saves dynamic XFA forms on Linux without Adobe Reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "form-pdf-reader"
path = "src/main.rs"

[dependencies]
form-pdf-reader-core = { path = "../core" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
png.workspace = true
rfd = "0.17"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[features]
# Solo para pruebas: EFRAME_SCREENSHOT_TO=/ruta.png guarda una captura y sale.
screenshot = ["eframe/__screenshot"]
