[package]
name = "form-pdf-reader-core"
description = "PDFium (V8 + XFA) integration and dynamic XFA form support used by Form PDF Reader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
# Se mantiene el nombre de la librería: el código la usa como form_pdf_reader.
name = "form_pdf_reader"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
log.workspace = true
lopdf.workspace = true
libc = "0.2"
flate2 = "1"
regex = "1"
# Contornos de las letras de las firmas escritas (sign::shape).
ttf-parser = "0.25"
# Firmas digitales del documento: CMS (PKCS#7), certificados y resúmenes
# (pdfium::Document::digital_signatures).
cms = "0.2"
der = { version = "0.7", features = ["oid"] }
x509-cert = "0.2"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
env_logger.workspace = true
png.workspace = true
